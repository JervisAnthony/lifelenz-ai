name: Format Probe

on:
  push:
    branches:
      - feature/web-record-history

permissions:
  contents: read

jobs:
  format-records-page:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        working-directory: web
        run: npm ci
      - name: Print exact formatted RecordsPage
        working-directory: web
        run: |
          npx prettier --write src/pages/RecordsPage.tsx
          echo 'FORMATTED_FILE_BEGIN'
          base64 -w 0 src/pages/RecordsPage.tsx
          echo
          echo 'FORMATTED_FILE_END'
