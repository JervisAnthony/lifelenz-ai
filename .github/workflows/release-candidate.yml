name: Release Candidate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mvp1-release-candidate:
    name: MVP1 Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LIFELENZ_IMAGE_TAG: mvp1-0.1.0-rc.1
      LIFELENZ_RC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.LIFELENZ_RC_SOURCE_SHA }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate ephemeral candidate credentials
        shell: bash
        run: |
          jwt_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          account_password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$account_password"
          {
            echo "LIFELENZ_JWT_SECRET=$jwt_secret"
            echo "LIFELENZ_RC_ACCOUNT_PASSWORD=$account_password"
          } >> "$GITHUB_ENV"

      - name: Install candidate build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Install locked web dependencies
        working-directory: web
        run: npm ci

      - name: Validate candidate metadata
        run: |
          mkdir -p release-artifacts
          python scripts/validate_release_candidate.py \
            --evidence-out release-artifacts/release-candidate-evidence.json

      - name: Build Python candidate distributions
        run: python -m build

      - name: Build web candidate bundle
        working-directory: web
        run: npm run build

      - name: Package candidate artifacts
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(python -c 'import json; print(json.load(open("release/manifest.json"))["candidate"])')"
          tar -C web/dist -czf "release-artifacts/lifelenz-web-${candidate}.tar.gz" .
          cp release/manifest.json release-artifacts/manifest.json
          {
            sha256sum dist/*
            sha256sum "release-artifacts/lifelenz-web-${candidate}.tar.gz"
            sha256sum release-artifacts/manifest.json
          } > release-artifacts/SHA256SUMS

      - name: Build production candidate images
        run: docker compose -f deploy/compose.yml build --pull

      - name: Start candidate stack
        run: docker compose -f deploy/compose.yml up -d

      - name: Create synthetic persisted candidate account
        shell: bash
        run: |
          set -euo pipefail

          wait_for() {
            local url="$1"
            for _ in $(seq 1 90); do
              if curl --fail --silent --show-error "$url" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_for "http://127.0.0.1:8080/healthz"
          wait_for "http://127.0.0.1:8080/api/v1/ready"

          python - <<'PY'
          import json
          import os
          import urllib.request

          password = os.environ["LIFELENZ_RC_ACCOUNT_PASSWORD"]
          base_url = "http://127.0.0.1:8080"

          def post(path: str, payload: dict[str, str]) -> dict[str, object]:
              request = urllib.request.Request(
                  base_url + path,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  return json.loads(response.read())

          account = post(
              "/api/v1/auth/register",
              {"email": "release-candidate@example.com", "password": password},
          )
          assert account["email"] == "release-candidate@example.com"

          token = post(
              "/api/v1/auth/login",
              {"email": "release-candidate@example.com", "password": password},
          )
          assert token["token_type"] == "bearer"
          assert isinstance(token["access_token"], str) and token["access_token"]
          PY

      - name: Create and export SQLite candidate backup
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.yml exec -T api \
            python /app/deploy/sqlite_maintenance.py backup \
            --database /var/lib/lifelenz/lifelenz.db \
            --output /tmp/lifelenz-rc-backup.db

          docker compose -f deploy/compose.yml cp \
            api:/tmp/lifelenz-rc-backup.db \
            "$RUNNER_TEMP/lifelenz-rc-backup.db"

          python deploy/sqlite_maintenance.py verify \
            --database "$RUNNER_TEMP/lifelenz-rc-backup.db"

          docker compose -f deploy/compose.yml exec -T api \
            rm -f /tmp/lifelenz-rc-backup.db

      - name: Restore backup into a fresh data volume
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.yml down -v --remove-orphans

          docker compose -f deploy/compose.yml run --rm -T \
            -v "$RUNNER_TEMP:/backup:ro" \
            api python /app/deploy/sqlite_maintenance.py restore \
            --input /backup/lifelenz-rc-backup.db \
            --database /var/lib/lifelenz/lifelenz.db \
            --confirm-api-stopped

          docker compose -f deploy/compose.yml up -d

      - name: Verify restored candidate state
        shell: bash
        run: |
          set -euo pipefail

          wait_for() {
            local url="$1"
            for _ in $(seq 1 90); do
              if curl --fail --silent --show-error "$url" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_for "http://127.0.0.1:8080/api/v1/ready"

          python - <<'PY'
          import json
          import os
          import urllib.request

          password = os.environ["LIFELENZ_RC_ACCOUNT_PASSWORD"]
          request = urllib.request.Request(
              "http://127.0.0.1:8080/api/v1/auth/login",
              data=json.dumps(
                  {"email": "release-candidate@example.com", "password": password}
              ).encode("utf-8"),
              headers={"Content-Type": "application/json", "Accept": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              payload = json.loads(response.read())

          assert payload["token_type"] == "bearer"
          assert isinstance(payload["access_token"], str) and payload["access_token"]
          PY

          rm -f "$RUNNER_TEMP/lifelenz-rc-backup.db"

      - name: Upload release-candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lifelenz-mvp1-0.1.0-rc.1
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*
            release-artifacts/*

      - name: Show candidate deployment logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml logs --no-color

      - name: Tear down candidate stack
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/lifelenz-rc-backup.db"
          docker compose -f deploy/compose.yml down -v --remove-orphans
