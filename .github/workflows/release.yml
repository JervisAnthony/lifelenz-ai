name: MVP1 Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: mvp1-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    name: MVP1 Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      LIFELENZ_IMAGE_TAG: mvp1-0.1.0
      LIFELENZ_RELEASE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.LIFELENZ_RELEASE_SOURCE_SHA }}
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate ephemeral release-validation credentials
        shell: bash
        run: |
          jwt_secret="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          account_password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$account_password"
          {
            echo "LIFELENZ_JWT_SECRET=$jwt_secret"
            echo "LIFELENZ_RELEASE_ACCOUNT_PASSWORD=$account_password"
          } >> "$GITHUB_ENV"

      - name: Install release build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Install locked web dependencies
        working-directory: web
        run: npm ci

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/validate_release.py \
              --expected-tag "$GITHUB_REF_NAME" \
              --evidence-out release-artifacts/release-evidence.json
          else
            python scripts/validate_release.py \
              --evidence-out release-artifacts/release-evidence.json
          fi

      - name: Verify release tag belongs to main history
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Build Python release distributions
        run: python -m build

      - name: Build web release bundle
        working-directory: web
        run: npm run build

      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail
          release_name="$(python -c 'import json; print(json.load(open("release/manifest.json"))["release"])')"
          tar -C web/dist -czf "release-artifacts/lifelenz-web-${release_name}.tar.gz" .
          cp release/manifest.json release-artifacts/manifest.json
          cp release/RELEASE_NOTES_v0.1.0.md release-artifacts/RELEASE_NOTES_v0.1.0.md
          {
            sha256sum dist/*
            sha256sum "release-artifacts/lifelenz-web-${release_name}.tar.gz"
            sha256sum release-artifacts/manifest.json
            sha256sum release-artifacts/release-evidence.json
            sha256sum release-artifacts/RELEASE_NOTES_v0.1.0.md
          } > release-artifacts/SHA256SUMS

      - name: Build production release images
        run: docker compose -f deploy/compose.yml build --pull

      - name: Start release-validation stack
        run: docker compose -f deploy/compose.yml up -d

      - name: Create synthetic persisted release account
        shell: bash
        run: |
          set -euo pipefail

          wait_for() {
            local url="$1"
            for _ in $(seq 1 90); do
              if curl --fail --silent --show-error "$url" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_for "http://127.0.0.1:8080/healthz"
          wait_for "http://127.0.0.1:8080/api/v1/ready"

          python - <<'PY'
          import json
          import os
          import urllib.request

          password = os.environ["LIFELENZ_RELEASE_ACCOUNT_PASSWORD"]
          base_url = "http://127.0.0.1:8080"

          def post(path: str, payload: dict[str, str]) -> dict[str, object]:
              request = urllib.request.Request(
                  base_url + path,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  return json.loads(response.read())

          account = post(
              "/api/v1/auth/register",
              {"email": "release-validation@example.com", "password": password},
          )
          assert account["email"] == "release-validation@example.com"

          token = post(
              "/api/v1/auth/login",
              {"email": "release-validation@example.com", "password": password},
          )
          assert token["token_type"] == "bearer"
          assert isinstance(token["access_token"], str) and token["access_token"]
          PY

      - name: Create and export SQLite release backup
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.yml exec -T api \
            python /app/deploy/sqlite_maintenance.py backup \
            --database /var/lib/lifelenz/lifelenz.db \
            --output /tmp/lifelenz-release-backup.db

          docker compose -f deploy/compose.yml cp \
            api:/tmp/lifelenz-release-backup.db \
            "$RUNNER_TEMP/lifelenz-release-backup.db"

          python deploy/sqlite_maintenance.py verify \
            --database "$RUNNER_TEMP/lifelenz-release-backup.db"

          docker compose -f deploy/compose.yml exec -T api \
            rm -f /tmp/lifelenz-release-backup.db

      - name: Restore backup into a fresh data volume
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.yml down -v --remove-orphans

          docker compose -f deploy/compose.yml run --rm -T \
            -v "$RUNNER_TEMP:/backup:ro" \
            api python /app/deploy/sqlite_maintenance.py restore \
            --input /backup/lifelenz-release-backup.db \
            --database /var/lib/lifelenz/lifelenz.db \
            --confirm-api-stopped

          docker compose -f deploy/compose.yml up -d

      - name: Verify restored release state
        shell: bash
        run: |
          set -euo pipefail

          wait_for() {
            local url="$1"
            for _ in $(seq 1 90); do
              if curl --fail --silent --show-error "$url" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_for "http://127.0.0.1:8080/api/v1/ready"

          python - <<'PY'
          import json
          import os
          import urllib.request

          password = os.environ["LIFELENZ_RELEASE_ACCOUNT_PASSWORD"]
          request = urllib.request.Request(
              "http://127.0.0.1:8080/api/v1/auth/login",
              data=json.dumps(
                  {"email": "release-validation@example.com", "password": password}
              ).encode("utf-8"),
              headers={"Content-Type": "application/json", "Accept": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=10) as response:
              payload = json.loads(response.read())

          assert payload["token_type"] == "bearer"
          assert isinstance(payload["access_token"], str) and payload["access_token"]
          PY

          rm -f "$RUNNER_TEMP/lifelenz-release-backup.db"

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lifelenz-mvp1-0.1.0
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*
            release-artifacts/*

      - name: Show release deployment logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml logs --no-color

      - name: Tear down release-validation stack
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/lifelenz-release-backup.db"
          docker compose -f deploy/compose.yml down -v --remove-orphans

  publish-release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download validated release artifacts
        uses: actions/download-artifact@v8
        with:
          name: lifelenz-mvp1-0.1.0
          path: release-bundle

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-bundle -type f -print | sort)
          test "${#files[@]}" -gt 0
          gh release create "$GITHUB_REF_NAME" \
            "${files[@]}" \
            --verify-tag \
            --title "LifeLenz MVP1 v0.1.0" \
            --notes-file release/RELEASE_NOTES_v0.1.0.md
